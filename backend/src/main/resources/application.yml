spring:
  application:
    name: phraseloop
  datasource:
    url: jdbc:postgresql://localhost:5432/phraseloop
    username: phraseloop
    password: phraseloop
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  servlet:
    session:
      timeout: 14d
      cookie:
        http-only: true
        same-site: lax
        name: PHRASELOOP_SESSION

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  timezone: Asia/Tokyo
