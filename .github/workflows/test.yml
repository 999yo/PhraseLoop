name: test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phraseloop
          POSTGRES_PASSWORD: phraseloop
          POSTGRES_DB: phraseloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phraseloop -d phraseloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Backend tests
        working-directory: backend
        run: mvn -B test
        env:
          TEST_DATASOURCE_URL: jdbc:postgresql://localhost:5432/phraseloop_test
          TEST_DATASOURCE_USERNAME: phraseloop
          TEST_DATASOURCE_PASSWORD: phraseloop

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
