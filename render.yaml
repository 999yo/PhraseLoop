services:
  - type: web
    name: phraseloop
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_TIMEZONE
        value: Asia/Tokyo
      - key: DATABASE_URL
        fromDatabase:
          name: phraseloop-db
          property: connectionString

databases:
  - name: phraseloop-db
    databaseName: phraseloop
    user: phraseloop
    plan: free
