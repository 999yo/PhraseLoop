services:
  - type: web
    name: phraseloop
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_TIMEZONE
        value: Asia/Tokyo
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://dpg-dbdgir4s728c73bst8b0-a:5432/phraseloop
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: phraseloop-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: phraseloop-db
          property: password

databases:
  - name: phraseloop-db
    databaseName: phraseloop
    user: phraseloop
    plan: free
